
apiVersion: apps/v1
kind: Deployment
metadata:
  name: note-dev
  namespace: development
  labels:
    app: note
spec:
  replicas: 1
  selector:
    matchLabels:
      app: note-dev
  template:
    metadata:
      labels:
        app: note-dev
    spec:
      containers:
        - name: note
          image: trainwithshubham/notes-app-k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: note-service
  namespace: development
spec:
  selector:
    app: note-dev
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
