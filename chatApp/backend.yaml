apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: chatapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: chatapp-backend
        image: trainwithshubham/chatapp-backend:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "500m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5001
        env:
        - name: MONGODB_URI
          value: mongodb://root:ChangeThisPassword123!@mongodb:27017/chatApp?authSource=admin
        - name: PORT
          value: "5001"
        - name: NODE_ENV
          value: "production"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: jwt-secret


---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: chatapp
type: Opaque
stringData:
  jwt-secret: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..ehelBbUU2IFJ8M5xzQL_UFatMxCMSojAOqWQaZQgrwk"

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: chatapp
spec:
  selector:
    app: backend
  ports:
  - port: 5001
    targetPort: 5001
