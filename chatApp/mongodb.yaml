apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: chatapp
type: Opaque
stringData:
  mongo-root-username: root
  mongo-root-password: ChangeThisPassword123!

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: chatapp
spec:
  selector:
    matchLabels:
      app: database
  serviceName: mongodb
  replicas: 1
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
        - name: database
          image: mongo:latest
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secrets
                  key: mongo-root-password
          volumeMounts:
            - name: database
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: chatapp
spec:
  clusterIP: None
  selector:
    app: database
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
